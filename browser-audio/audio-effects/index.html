<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Audio Processor</title>

  
  <script src="libraries/p5.js"></script>
  <script src="libraries/p5.sound.js"></script>


  <script src="sketch.js"></script>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
  <h1>Audio Processor</h1>

  <div class="main-layout-container">

    <div class="left-column">
      <div class="control-group playback-controls-vertical">
        <h3>Playback Controls</h3>
        <button id="playButton">Play</button>
        <button id="pauseButton">Pause</button>
        <button id="stopButton">Stop</button>
        <button id="skipToStartButton">Skip to Start</button>
        <button id="skipToEndButton">Skip to End</button>
        <button id="loopButton">Loop</button>
        <button id="recordButton">Record</button>
      </div>

      <div class="control-group">
        <h3>Audio Source</h3>
        <label><input type="radio" name="audioSource" id="fileSource" value="file" checked> Pre-recorded File</label>
        <label><input type="radio" name="audioSource" id="micSource" value="mic"> Microphone Input</label>
        <input type="file" id="audioFileInput" accept="audio/*">
      </div>
      </div>

    <div class="center-column">
      <div class="spectrum-display">
        <h3>Spectrum In</h3>
        <canvas id="spectrumInCanvas" width="350" height="150"></canvas>
        <h3>Spectrum Out</h3>
        <canvas id="spectrumOutCanvas" width="350" height="150"></canvas>
      </div>
    </div>

    <div class="right-column">
      <div class="control-group">
        <h3>Filter</h3>
        <label><input type="radio" name="filterType" value="lowpass" checked> Low-Pass</label>
        <label><input type="radio" name="filterType" value="highpass"> High-Pass</label>
        <label><input type="radio" name="filterType" value="bandpass"> Band-Pass</label>
        <label for="cutoffFreq">Cutoff Frequency:</label>
        <input type="range" id="cutoffFreq" min="20" max="20000" value="1000" step="1">
        <label for="resonance">Resonance:</label>
        <input type="range" id="resonance" min="0" max="100" value="0" step="0.1">
        <label for="filterDryWet">Dry/Wet:</label>
        <input type="range" id="filterDryWet" min="0" max="1" value="1" step="0.01">
        <label for="filterOutputLevel">Output Level:</label>
        <input type="range" id="filterOutputLevel" min="0" max="1" value="1" step="0.01">
      </div>

      <div class="control-group">
        <h3>Delay</h3>
        <label for="delayTime">Delay Time (s):</label>
        <input type="range" id="delayTime" min="0" max="1" value="0.5" step="0.01">
        <label for="delayFeedback">Feedback:</label>
        <input type="range" id="delayFeedback" min="0" max="1" value="0.5" step="0.01">
        <label for="delayDryWet">Dry/Wet:</label>
        <input type="range" id="delayDryWet" min="0" max="1" value="0.5" step="0.01">
      </div>

      <div class="control-group">
        <h3>Waveshaper Distortion</h3>
        <label for="distortionAmount">Distortion Amount:</label>
        <input type="range" id="distortionAmount" min="0" max="1" value="0.5" step="0.01">
        <label for="oversample">Oversample:</label>
        <select id="oversample">
          <option value="none">None</option>
          <option value="2x">2x</option>
          <option value="4x">4x</option>
        </select>
        <label for="distortionDryWet">Dry/Wet:</label>
        <input type="range" id="distortionDryWet" min="0" max="1" value="1" step="0.01">
        <label for="distortionOutputLevel">Output Level:</label>
        <input type="range" id="distortionOutputLevel" min="0" max="1" value="1" step="0.01">
      </div>

      <div class="control-group">
        <h3>Dynamic Compressor</h3>
        <label for="attack">Attack (s):</label>
        <input type="range" id="attack" min="0" max="1" value="0.003" step="0.001">
        <label for="knee">Knee (dB):</label>
        <input type="range" id="knee" min="0" max="40" value="30" step="1">
        <label for="release">Release (s):</label>
        <input type="range" id="release" min="0" max="1" value="0.25" step="0.01">
        <label for="ratio">Ratio:</label>
        <input type="range" id="ratio" min="1" max="20" value="12" step="0.1">
        <label for="threshold">Threshold (dB):</label>
        <input type="range" id="threshold" min="-100" max="0" value="-24" step="1">
        <label for="compressorDryWet">Dry/Wet:</label>
        <input type="range" id="compressorDryWet" min="0" max="1" value="1" step="0.01">
        <label for="compressorOutputLevel">Output Level:</label>
        <input type="range" id="compressorOutputLevel" min="0" max="1" value="1" step="0.01">
      </div>

      <div class="control-group">
        <h3>Reverb</h3>
        <label for="reverbDuration">Duration (s):</label>
        <input type="range" id="reverbDuration" min="0" max="10" value="3" step="0.1">
        <label for="decayRate">Decay Rate:</label>
        <input type="range" id="decayRate" min="0" max="100" value="2" step="0.1">
        <button id="reverseReverb">Reverse</button>
        <label for="reverbDryWet">Dry/Wet:</label>
        <input type="range" id="reverbDryWet" min="0" max="1" value="0.5" step="0.01">
        <label for="reverbOutputLevel">Output Output Level:</label>
        <input type="range" id="reverbOutputLevel" min="0" max="1" value="1" step="0.01">
      </div>
    </div>

  </div>
</body>

</html>
