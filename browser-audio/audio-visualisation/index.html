<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Project</title>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #333;
            color: white;
            font-family: Arial, sans-serif;
        }

        #captcha-section,
        #visualisation-section {
            background-color: #444;
            padding: 20px;
            margin: 20px;
            border-radius: 10px;
            width: 80%;
            max-width: 600px;
        }

        button,
        input,
        select {
            margin: 5px;
            padding: 8px;
            border-radius: 5px;
            border: none;
        }

        canvas {
            margin-top: 10px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/addons/p5.sound.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/IDMNYU/p5.js-speech@0.0.3/lib/p5.speech.js"></script>
    <script type="text/javascript" src="https://unpkg.com/meyda@5.3.0/dist/web/meyda.min.js"></script>

    <script src="sketch.js"></script>
</head>

<body>
    <div id="captcha-section">
        <h2>Audio CAPTCHA</h2>
        <button id="play-captcha">Play CAPTCHA</button>
        <input type="text" id="captcha-answer" placeholder="Type your answer">
        <button id="submit-captcha">Submit</button>
        <p id="captcha-status"></p>
        <div id="captcha-visualisation"></div>
    </div>

    <hr style="margin: 20px 0; width: 80%;">

    <div id="visualisation-section">
        <h2>Audio Visualisation</h2>
        <select id="audio-selector">
            <option value="Ex2_sound1.wav">Sound 1</option>
            <option value="Ex2_sound2.wav">Sound 2</option>
            <option value="Ex2_sound3.wav">Sound 3</option>
        </select>
        <button id="play-visualisation">Play</button>
        <p>Use voice commands to control color and shape!</p>
        <div id="visualisation-canvas"></div>
    </div>
</body>

</html>
